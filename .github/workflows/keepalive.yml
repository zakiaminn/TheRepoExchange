name: TRX Ledger Keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping ledger health check
        run: curl -sf --max-time 90 https://trx-ledger.onrender.com/ || echo "Ledger did not respond"
