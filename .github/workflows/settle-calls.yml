name: TRX Call Settlement

# hits the ledger's POST /api/calls/settle every hour to settle calls past their deadline.
# it only touches open calls, so a double run doesn't pay out twice. runs at :30 so it
# doesn't fire at the same minute as ingestion

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Settle due calls
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST https://trx-ledger.onrender.com/api/calls/settle \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "content-type: application/json" \
            -w $'\nHTTP %{http_code}\n'
